# Конфиг Amvera для приватного Ollama-сервиса.
# ДОЛЖЕН лежать в КОРНЕ репозитория — иначе Amvera его не читает и ищет Dockerfile
# в дефолтных местах (Dockerfile, docker/, deploy/, deployment/, amvera/), не находит
# наш deploy/amvera/Dockerfile и падает (kaniko печатает --help, exit 1).
# docker-compose.yml НЕ поддерживается.
meta:
  environment: docker
  toolchain:
    name: docker
build:
  # Путь относительно корня репозитория, без ведущего слэша.
  dockerfile: deploy/amvera/Dockerfile
run:
  # Порт, который слушает Ollama внутри контейнера; Amvera проксирует на него
  # публичный домен (80/443). Произвольные TCP наружу нельзя — только HTTP(S).
  containerPort: 11434
  # Постоянный том: модели ($OLLAMA_MODELS=/data/models) переживают пересборки.
  persistenceMount: /data
